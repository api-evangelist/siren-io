- name: Generate Query
paths:
  /api/generate-query/dashboard:
    get:
      operationId: getGenerateQueryDashboard
      tags:
      - Generate Query
      summary: Returns a list of saved dashboards in the system
      x-source: https://docs.siren.io/siren-platform-user-guide/16.0/siren-investigate/c_dashboard-api.html
      parameters:
      - name: id
        in: query
        required: false
        schema:
          type: string
        description: Fetches the dashboard that has the specified ID
      responses:
        '200':
          description: A list of saved dashboards (or one, when id is given).
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
      x-evidence:
        kind: documentation
  /api/generate-query/search:
    get:
      operationId: getGenerateQuerySearch
      tags:
      - Generate Query
      summary: Returns a list of entity tables and searches in the system
      x-source: https://docs.siren.io/siren-platform-user-guide/16.0/siren-investigate/c_search-api.html
      parameters:
      - name: id
        in: query
        required: false
        schema:
          type: string
        description: Fetches the search that has the specified ID
      responses:
        '200':
          description: A list of saved dashboards (or one, when id is given).
          content:
            application/json:
              schema:
                type: array
